spring:
  cache:
    type: simple
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:capstone-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
            scope:
              - profile
              - email
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
          naver:
            client-id: test-naver-client
            client-secret: test-naver-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

gemini:
  api:
    url: http://localhost
    key: test

aws:
  s3:
    region: ap-northeast-2
    access-key: test
    secret-key: test
    bucket: test
    presigned-url-expiration: 3600

search:
  pcmap:
    enabled: false

parking-lot:
  gyeonggi-api:
    enabled: false
  seoul-citydata:
    enabled: false

reservation:
  provider:
    mode: mock
    runtime: direct-rest
    calling-enabled: false
    real-call-enabled: false
    call-allowlist-enabled: true
    require-allowlist-for-external-call: true
    prod-external-call-blocked: true
    external-call-allowed-profiles:
      - dev
    call-allowed-numbers:
      - "01000000000"
    webhook-base-url: http://localhost
    webhook-max-clock-skew-seconds: 300
    webhook-raw-payload-store-enabled: false
    transcript-store-enabled: false
    recording-store-enabled: false
    mock-result-api-enabled: true
  scheduler:
    enabled: false
  webhook:
    mock:
      enabled: true
      signature-secret: test-mock-reservation-webhook-secret
      allowed-clock-skew-seconds: 300

openai:
  api-key:
  project-id:
  webhook-secret:
  realtime:
    model:
    voice:
    instructions-version: reservation-mvp-v1
    session-timeout-seconds: 600
    ws-url:
    sip-endpoint:

twilio:
  account-sid:
  auth-token:
  from-number:
  status-callback-url:
  voice-webhook-url:
  media-stream-url:
  webhook-signature-enabled: true
  dialing-country-allowlist: []

clawops:
  api-key:
  account-id:
  base-url: https://api.claw-ops.com
  from-number:
  status-callback-url:
  webhook-signing-key:
  webhook-signature-header: X-Signature
  call-timeout-seconds: 30
  recording-enabled: false
  transcript-enabled: false
  summary-enabled: false
  agent-runtime-mode: noop
  sidecar-base-url:
  sidecar-internal-signing-key:
  sidecar-connect-timeout-seconds: 3
  sidecar-read-timeout-seconds: 10
  sidecar-readiness-required: false
