name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Capstone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: Capstone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build boot jar
        run: ./gradlew bootJar -x test

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar to EC2
        run: |
          RELEASE_NAME="Capstone-${GITHUB_SHA}.jar"
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p /home/ubuntu/app/releases /home/ubuntu/app/current"
          scp -i ~/.ssh/ec2_key \
            build/libs/Capstone-0.0.1-SNAPSHOT.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/releases/${RELEASE_NAME}.tmp"

      - name: Restart backend on EC2
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "RELEASE_NAME=Capstone-${GITHUB_SHA}.jar bash -s" <<'EOF'
          set -e
          mv "/home/ubuntu/app/releases/${RELEASE_NAME}.tmp" "/home/ubuntu/app/releases/${RELEASE_NAME}"
          pkill -f '/home/ubuntu/app/current/Capstone-0.0.1-SNAPSHOT.jar' || true
          cp "/home/ubuntu/app/releases/${RELEASE_NAME}" "/home/ubuntu/app/current/Capstone-0.0.1-SNAPSHOT.jar"
          bash /home/ubuntu/start.sh
          sleep 5
          pgrep -f '/home/ubuntu/app/current/Capstone-0.0.1-SNAPSHOT.jar'
          EOF
